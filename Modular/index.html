<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker - Modular Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        .csv-drop-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
        .tab-content.hidden { display: none; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        #transactionEditor { transition: transform 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <div id="authContainer">
        <!-- Auth UI will be rendered here by AuthService -->
    </div>

    <div id="mainApp" class="hidden">
        <header class="bg-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center py-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Finance Tracker</h1>
                    </div>
                    <div id="header-buttons" class="flex items-center space-x-4">
                        <button id="importTransactionsBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition flex items-center gap-2 text-sm">Import</button>
                        <button id="addTransactionBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2 text-sm">Add</button>
                        <span id="userInfo" class="text-sm text-gray-600"></span>
                        <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="p-6">
            <div id="dashboard-container"></div>
            <div id="search-container"></div>
            <div id="transactions-container" class="mt-6"></div>
        </main>
    </div>

    <!-- Modals and Side Panels will be managed by their respective UI components -->
    <div id="modal-container"></div>
    <div id="editor-container"></div>
    <div id="notification-container" class="fixed bottom-5 right-5 z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import {
            getFirestore, collection, query, getDocs, addDoc, doc, updateDoc,
            serverTimestamp, orderBy, limit, writeBatch
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // Configuration
        import { AppConfig } from './js/config/AppConfig.js';

        // Core Services
        import { AuthService } from './js/auth/AuthService.js';
        import { DataService } from './js/data/DataService.js';
        import { GeminiService } from './js/ai/GeminiService.js';

        // UI Components
        import { UIManager } from './js/ui/UIManager.js';
        import { SettingsManager } from './js/settings/SettingsManager.js';
        import { NotificationManager } from './js/ui/NotificationManager.js';
        import { QuickActions } from './js/ui/QuickActions.js';

        // Main Integration Layer
        import { CategoryIntegration } from './js/integration/CategoryIntegration.js';
        
        // Utilities & Analytics
        import { TransferMatcher } from './js/utils/TransferMatcher.js';
        import { BusinessAnalytics } from './js/analytics/BusinessAnalytics.js';
        import { DataExporter } from './js/export/DataExporter.js';
        window.DataExporter = DataExporter;

        // Add debugging directly here instead
        class QuickDebug {
            constructor(app) {
                this.app = app;
                console.log('🔍 Debug initialized');
            }
            
            checkStatus() {
                console.group('📊 App Status');
                console.log('App exists:', !!this.app);
                console.log('User:', this.app?.authService?.currentUser?.email || 'Not logged in');
                console.log('Accounts:', this.app?.accounts?.length || 0);
                console.log('Transactions:', this.app?.transactions?.length || 0);
                console.groupEnd();
            }

            async checkDataIntegrity() {
                const transactions = await this.app.dataService.loadTransactions(1000);

                // Group by account
                const byAccount = {};
                transactions.forEach(t => {
                    if (!byAccount[t.accountId]) {
                        byAccount[t.accountId] = { count: 0, total: 0 };
                    }
                    byAccount[t.accountId].count++;
                    byAccount[t.accountId].total += t.amount;
                });

                console.table(byAccount);

                // Check Tech Business specifically
                const techTransactions = transactions.filter(t =>
                    t.entity === 'Tech Business' ||
                    t.accountId === '7991' ||
                    t.description?.toLowerCase().includes('packer')
                );

                console.log('Tech Business Transactions:', techTransactions.length);
                console.table(techTransactions.slice(0, 5));
            }
        }

        class App {
            constructor() {
                this.authService = null;
                this.dataService = null;
                this.geminiService = null;
                this.uiManager = null;
                this.categoryIntegration = null;
                this.settingsManager = null;
                this.transactions = [];
                this.accounts = [];
                this.config = AppConfig; // Make config available to integrations
            }

            init() {
                this.uiManager.init(this);
                this.settingsManager.init(this.uiManager);

                this.authService.onAuthStateChanged(async (user) => {
                    if (user) {
                        this.uiManager.showMainApp(user);
                        // Ensure default accounts exist
                        await app.dataService.ensureDefaultAccounts();
                        await this.loadDataAndRender();
                    } else {
                        this.uiManager.showAuth();
                    }
                });
            }

            async loadDataAndRender() {
                try {
                    [this.accounts, this.transactions] = await Promise.all([
                        this.dataService.loadAccounts(),
                        this.dataService.loadTransactions()
                    ]);
                    
                    console.log(`Loaded ${this.accounts.length} accounts and ${this.transactions.length} transactions.`);
                    
                    // Match transfers after loading
                    const transferPairs = TransferMatcher.findTransferPairs(this.transactions);
                    if (transferPairs.length > 0) {
                        console.log(`Found ${transferPairs.length} transfer pairs.`);
                    }

                    // Generate the business analytics report
                    const analytics = new BusinessAnalytics(this.transactions);
                    const report = analytics.generateReport();

                    this.uiManager.renderDashboard(report);
                    this.uiManager.renderTransactionList(this.transactions);

                } catch (error) {
                    console.error("Failed to load data and render:", error);
                    this.uiManager.showNotification("Error loading application data.", "error");
                }
            }

            async addTransaction(data) {
                // FIX APPLIED: Changed addTransaction to saveTransaction
                try {
                    const newTransaction = await this.dataService.saveTransaction(data);
                    this.transactions.unshift(newTransaction);
                    this.uiManager.renderTransactionList(this.transactions);
                    this.uiManager.showNotification("Transaction added successfully.", "success");
                } catch (error) {
                    console.error("Failed to add transaction:", error);
                    this.uiManager.showNotification(error.message, "error");
                }
            }

            async updateTransaction(data) {
                const updatedTransaction = await this.dataService.updateTransaction(data.id, data);
                const index = this.transactions.findIndex(t => t.id === data.id);
                if (index !== -1) {
                    this.transactions[index] = updatedTransaction;
                }
                this.uiManager.renderTransactionList(this.transactions);
                this.uiManager.showNotification("Transaction updated.", "success");
            }

            async deleteTransaction(id) {
                 await this.dataService.deleteTransaction(id);
                 this.transactions = this.transactions.filter(t => t.id !== id);
                 this.uiManager.renderTransactionList(this.transactions);
                 this.uiManager.showNotification("Transaction deleted.", "error");
            }

            importTransactions(file) {
                // Defensive check to ensure the integration layer is ready
                if (this.categoryIntegration && this.categoryIntegration.csvImporter) {
                    console.log("Transaction import process started via CategoryIntegration.");
                    // The importer will handle file reading, parsing, and calling back to add transactions
                    this.categoryIntegration.csvImporter.import(file, (transactions) => {
                        console.log('transactions from importer', transactions);
                        this.loadDataAndRender();
                        this.uiManager.showNotification(`${transactions.length} transactions imported successfully.`, "success");
                    });
                } else {
                    console.error('CategoryIntegration or its CSV importer is not properly initialized.');
                    this.uiManager.showNotification("Import feature is currently unavailable.", "error");
                }
            }

            exportTransactions() {
                if (this.transactions && this.transactions.length > 0) {
                    DataExporter.exportToCSV(this.transactions);
                    this.uiManager.showNotification('Transactions exported successfully.', 'success');
                } else {
                    this.uiManager.showNotification('No transactions to export.', 'warning');
                }
            }

            async runAiCategorization() {
                const uncategorized = this.transactions.filter(t => t.category === 'Uncategorized');

                if (uncategorized.length === 0) {
                    this.uiManager.showNotification('No transactions to categorize.', 'info');
                    return 0;
                }

                const suggestions = await this.geminiService.batchCategorize(uncategorized);
                let successCount = 0;

                for (const { transaction, suggestion } of suggestions) {
                    if (suggestion && suggestion.category !== 'Uncategorized') {
                        await this.dataService.updateTransaction(transaction.id, {
                            category: suggestion.category,
                            subcategory: suggestion.subcategory,
                            entity: suggestion.entity
                        });
                        successCount++;
                    }
                }

                return successCount;
            }

            async recoverTechBusinessData() {
                const transactions = await this.dataService.loadTransactions(1000);
                let fixed = 0;

                for (const t of transactions) {
                    // Find all potential Tech Business transactions
                    const desc = t.description?.toLowerCase() || '';
                    const isTechBusiness = (
                        (t.amount > 10000 && (desc.includes('packer') || desc.includes('thomas'))) ||
                        (t.amount > 5000 && t.accountId === '7991') ||
                        (desc.includes('packerthomas') && t.amount > 0)
                    );

                    if (isTechBusiness && t.entity !== 'Tech Business') {
                        await this.dataService.updateTransaction(t.id, {
                            category: 'Tech Business Income',
                            subcategory: 'Consulting',
                            entity: 'Tech Business',
                            accountId: '7991'
                        });
                        fixed++;
                        console.log(`Fixed: ${t.description} - $${t.amount}`);
                    }
                }

                if (fixed > 0) {
                    this.uiManager.showNotification(`Recovered ${fixed} Tech Business transactions`, 'success');
                    await this.loadDataAndRender();
                }
                return fixed;
            }
        }

        async function main() {
            // This is the main entry point for the application.
            // It follows a structured initialization process to prevent race conditions.

            // Step 1: Initialize Firebase. This is the foundational service.
            const firebaseApp = initializeApp(AppConfig.FIREBASE_CONFIG);
            const auth = getAuth(firebaseApp);
            const firestore = getFirestore(firebaseApp);

            // Step 2: Instantiate core services. These services are the building blocks
            // of the application's functionality. They are created here so they can be
            // injected as dependencies into other components that need them.
            const notificationManager = new NotificationManager();
            const authService = new AuthService(auth);
            const firestoreFunctions = {
                collection, query, getDocs, addDoc, doc, updateDoc,
                serverTimestamp, orderBy, limit, writeBatch
            };
            const dataService = new DataService(authService, firestore, firestoreFunctions);
            const geminiService = new GeminiService(AppConfig.GEMINI_API_KEY);
            await geminiService.initialize();

            // Step 3: Create the main application controller shell.
            const app = new App();
            window.app = app; // Make app instance globally available
            app.dataService = dataService; // Pass dataservice early for integrations

            // Step 4: Instantiate and initialize the integration layer.
            const categoryIntegration = new CategoryIntegration(app);
            const integrationServices = await categoryIntegration.initialize();
            
            // Step 5: Instantiate other managers that depend on the integration services.
            const settingsManager = new SettingsManager(geminiService, integrationServices.categoryManager);
            const uiManager = new UIManager({
                ...integrationServices,
                settingsManager,
                notificationManager,
                authService
            });

            // Step 6: Fully configure the app controller with all its dependencies.
            app.authService = authService;
            app.geminiService = geminiService;
            app.uiManager = uiManager;
            app.settingsManager = settingsManager;
            app.categoryIntegration = integrationServices; // Add the integration services to the app

            // Step 7: Initialize the app's main logic (auth listener, data loading).
            app.init();

            document.body.insertAdjacentHTML('beforeend', QuickActions.render());

            console.log("Finance Tracker Initialized");
            
            // Initialize new QuickDebug class
            window.debugUtils = new QuickDebug(app);
            window.recoverTech = () => app.recoverTechBusinessData();
        }

        // Run the app
        main().catch(console.error);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + F for search
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchTransactionsBtn')?.click();
            }

            // Escape to return to dashboard
            if (e.key === 'Escape') {
                const searchContainer = document.getElementById('search-container');
                if (searchContainer && searchContainer.style.display !== 'none') {
                    app.uiManager.showDashboard();
                }
            }
        });
    </script>
</body>
</html>
